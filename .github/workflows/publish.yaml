name: registry

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# registry.yml and marigold-version name the marigold release that
# builds the registry: 0.8.2 is the first with manifests and tag versions.
jobs:
  registry:
    uses: bayinfosys/marigold/.github/workflows/registry.yml@v0.8.2
    with:
      marigold-version: "0.8.2"
      site-builder: ghcr.io/bayinfosys/jekyll-site-builder:v0.0.2
      deploy: ${{ startsWith(github.ref, 'refs/tags/v') }}
