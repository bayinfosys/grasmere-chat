name: registry

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# registry.yml and marigold-version must name the marigold release with
# manifests and tag versions (registry build --version). 0.8.1 predates
# both and rejects applications without a version.
jobs:
  registry:
    uses: bayinfosys/marigold/.github/workflows/registry.yml@v0.9.0
    with:
      marigold-version: "0.9.0"
      site-builder: ghcr.io/bayinfosys/jekyll-site-builder:v0.0.2
      deploy: ${{ startsWith(github.ref, 'refs/tags/v') }}
